# dsh-cubox bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (declared by the `dsh.bundle.patch`
# manifest field in package.json). Activate with:
#
#   # local development (link)
#   dsh plugin --profile web add link:/path/to/dsh-cubox
#   # after publishing to GitHub (repo tagged with the `dsh-plugin` topic)
#   dsh plugin --profile web add github:zhengjy01/dsh-cubox
- insert:
    - id: cubox
      name: dsh-cubox
      config:
        announceToAgent: true   # 在系统提示中公告插件（工具 + 能力说明）
        enabled: true           # 插件总开关
        syncMinutes: 60         # 定时同步间隔（分钟），0 = 关闭定时
